name: Agent test build

on:
  push:
    branches: [agent/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: agent-test-windows
      - name: Build the client and horizon-ctl
        run: cargo build --locked --profile fast -p horizon-client --bin horizon-client --bin horizon-ctl
      - name: Upload the test build
        uses: actions/upload-artifact@v4
        with:
          name: horizon-windows-test
          path: |
            target/fast/horizon-client.exe
            target/fast/horizon-ctl.exe
          if-no-files-found: error
